<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Light Squares -->
  <rect x="0" y="0" width="32" height="32" fill="#F5DEB3" />
  <rect x="32" y="32" width="32" height="32" fill="#F5DEB3" />
  
  <!-- Dark Squares -->
  <rect x="32" y="0" width="32" height="32" fill="#8B4513" />
  <rect x="0" y="32" width="32" height="32" fill="#8B4513" />
  
  <!-- Black Piece (Top Right) -->
  <circle cx="48" cy="16" r="12" fill="#1A1A1A" stroke="#000000" stroke-width="2" />
  <circle cx="48" cy="16" r="8" fill="none" stroke="#333333" stroke-width="1.5" />
  
  <!-- White Piece (Bottom Left) -->
  <circle cx="16" cy="48" r="12" fill="#F8F8F8" stroke="#D3D3D3" stroke-width="2" />
  <circle cx="16" cy="48" r="8" fill="none" stroke="#E8E8E8" stroke-width="1.5" />
</svg>
